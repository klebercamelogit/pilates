<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Clínica de Pilates</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card card">
    <div class="brand">
      <h1>Pilates</h1>
      <span class="mark">STUDIO / RAIL 01</span>
    </div>
    <p>Entre com seu e-mail e senha para acessar sua agenda.</p>

    <div id="alerta"></div>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input type="password" id="senha" required>
        <button type="button" class="toggle-senha" tabindex="-1"></button>
      </div>

      <button type="submit" style="width:100%">Entrar</button>
    </form>

    <p style="margin-top:1.4em; font-size:0.85rem;">
      Ainda não tem conta? <a href="/cadastro">Cadastre-se</a><br>
      <a href="/esqueci-senha">Esqueci minha senha</a>
    </p>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  limparAlerta('alerta');
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  try {
    const data = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, senha }),
    });
    salvarSessao({ usuario_id: data.usuario_id, papel: data.papel, email, token: data.token });
    window.location.href = data.papel === 'admin' ? '/admin' : '/painel';
  } catch (err) {
    mostrarAlerta('alerta', err.message);
  }
});
</script>
</body>
</html>
