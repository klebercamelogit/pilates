<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar conta — Clínica de Pilates</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card card">
    <div class="brand">
      <h1>Ativar conta</h1>
      <span class="mark">STUDIO / RAIL 01</span>
    </div>
    <p>Enviamos um código de 6 dígitos para o seu e-mail. Informe abaixo para ativar sua conta.</p>

    <div id="alerta"></div>

    <form id="form-ativar">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="codigo">Código de verificação</label>
      <input type="text" id="codigo" maxlength="6" required>

      <button type="submit" style="width:100%">Ativar conta</button>
    </form>

    <p style="margin-top:1.2em; font-size:0.85rem;">
      <a href="/">Voltar para o login</a>
    </p>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get('email')) {
  document.getElementById('email').value = params.get('email');
}

document.getElementById('form-ativar').addEventListener('submit', async (e) => {
  e.preventDefault();
  limparAlerta('alerta');
  try {
    await api('/api/auth/ativar', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        codigo: document.getElementById('codigo').value,
      }),
    });
    mostrarAlerta('alerta', 'Conta ativada! Redirecionando para o login...', 'success');
    setTimeout(() => window.location.href = '/', 1200);
  } catch (err) {
    mostrarAlerta('alerta', err.message);
  }
});
</script>
</body>
</html>
