<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Clínica de Pilates</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card card" style="max-width: 480px;">
    <div class="brand">
      <h1>Criar conta</h1>
      <span class="mark">STUDIO / RAIL 01</span>
    </div>
    <p>Preencha seus dados para agendar suas sessões de Pilates.</p>

    <div id="alerta"></div>

    <form id="form-cadastro">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="whatsapp">WhatsApp</label>
      <input type="text" id="whatsapp" placeholder="DDD + número" required>

      <div class="grid-2">
        <div>
          <label for="cep">CEP</label>
          <input type="text" id="cep" maxlength="8" placeholder="somente números">
        </div>
        <div>
          <label for="numero">Número</label>
          <input type="text" id="numero">
        </div>
      </div>

      <label for="endereco">Endereço</label>
      <input type="text" id="endereco">

      <label for="complemento">Complemento</label>
      <input type="text" id="complemento">

      <div class="grid-2">
        <div>
          <label for="idade">Idade</label>
          <input type="number" id="idade" min="0">
        </div>
        <div>
          <label for="dia_nascimento">Dia de nascimento</label>
          <input type="number" id="dia_nascimento" min="1" max="31">
        </div>
      </div>

      <label for="mes_nascimento">Mês de nascimento</label>
      <input type="number" id="mes_nascimento" min="1" max="12">

      <label for="senha">Senha</label>
      <input type="password" id="senha" required>

      <label for="repetir_senha">Repetir senha</label>
      <input type="password" id="repetir_senha" required>

      <label style="display:flex; align-items:flex-start; gap:0.6em; text-transform:none; font-weight:400; margin-top:0.4em;">
        <input type="checkbox" id="consentimento" style="width:auto; margin:0.2em 0 0;" required>
        <span>Autorizo o tratamento dos meus dados de saúde (comorbidades, exames) para fins de acompanhamento do meu tratamento nesta clínica, conforme a LGPD.</span>
      </label>

      <button type="submit" style="width:100%; margin-top:0.8em;">Criar conta</button>
    </form>

    <p style="margin-top:1.2em; font-size:0.85rem;">
      Já tem conta? <a href="/">Entrar</a>
    </p>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
// Busca automática de endereço via ViaCEP (API pública, sem chave necessária)
document.getElementById('cep').addEventListener('blur', async () => {
  const cep = document.getElementById('cep').value.replace(/\D/g, '');
  if (cep.length !== 8) return;
  try {
    const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const data = await resp.json();
    if (!data.erro) {
      document.getElementById('endereco').value =
        `${data.logradouro}, ${data.bairro}, ${data.localidade} - ${data.uf}`;
    }
  } catch (e) { /* CEP inválido ou serviço fora do ar — usuário preenche manualmente */ }
});

document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
  e.preventDefault();
  limparAlerta('alerta');

  const senha = document.getElementById('senha').value;
  const repetir = document.getElementById('repetir_senha').value;
  if (senha !== repetir) {
    mostrarAlerta('alerta', 'As senhas não conferem.');
    return;
  }
  if (!document.getElementById('consentimento').checked) {
    mostrarAlerta('alerta', 'É necessário aceitar o tratamento de dados de saúde para se cadastrar.');
    return;
  }

  const payload = {
    nome: document.getElementById('nome').value,
    email: document.getElementById('email').value,
    whatsapp: document.getElementById('whatsapp').value,
    cep: document.getElementById('cep').value,
    endereco: document.getElementById('endereco').value,
    numero: document.getElementById('numero').value,
    complemento: document.getElementById('complemento').value,
    idade: document.getElementById('idade').value || null,
    dia_nascimento: document.getElementById('dia_nascimento').value || null,
    mes_nascimento: document.getElementById('mes_nascimento').value || null,
    senha: senha,
    consentimento_lgpd_aceito: true,
  };

  try {
    await api('/api/auth/cadastro', { method: 'POST', body: JSON.stringify(payload) });
    window.location.href = `/ativar?email=${encodeURIComponent(payload.email)}`;
  } catch (err) {
    mostrarAlerta('alerta', err.message);
  }
});
</script>
</body>
</html>
