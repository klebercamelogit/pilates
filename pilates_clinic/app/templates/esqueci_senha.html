<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci minha senha — Clínica de Pilates</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card card">
    <div class="brand">
      <h1>Recuperar senha</h1>
      <span class="mark">STUDIO / RAIL 01</span>
    </div>
    <p>Informe seu e-mail. Se houver uma conta ativa, enviaremos um link para redefinir a senha.</p>

    <div id="alerta"></div>

    <form id="form-email">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <button type="submit" style="width:100%">Enviar link de redefinição</button>
    </form>

    <p style="margin-top:1.2em; font-size:0.85rem;">
      Já tem um token em mãos? <a href="/redefinir-senha">Redefinir senha</a><br>
      <a href="/">Voltar para o login</a>
    </p>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
document.getElementById('form-email').addEventListener('submit', async (e) => {
  e.preventDefault();
  limparAlerta('alerta');
  try {
    const data = await api('/api/auth/esqueci-senha/iniciar', {
      method: 'POST',
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });
    mostrarAlerta('alerta', data.mensagem, 'success');
  } catch (err) {
    mostrarAlerta('alerta', err.message);
  }
});
</script>
</body>
</html>
