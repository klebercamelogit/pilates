<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primeiro acesso — Clínica de Pilates</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card card">
    <div class="brand">
      <h1>Primeiro acesso</h1>
      <span class="mark">STUDIO / RAIL 01</span>
    </div>
    <p>Você foi cadastrado(a) pela clínica. Defina sua senha e aceite o uso de dados de saúde para ativar sua conta.</p>

    <div id="alerta"></div>

    <form id="form-primeiro-acesso">
      <label for="token">Token recebido por e-mail</label>
      <input type="text" id="token" required>

      <label for="nova_senha">Defina sua senha</label>
      <div class="campo-senha">
        <input type="password" id="nova_senha" required>
        <button type="button" class="toggle-senha" tabindex="-1"></button>
      </div>

      <label for="repetir_senha">Repita a senha</label>
      <div class="campo-senha">
        <input type="password" id="repetir_senha" required>
        <button type="button" class="toggle-senha" tabindex="-1"></button>
      </div>

      <label style="display:flex; align-items:flex-start; gap:0.6em; text-transform:none; font-weight:400; margin-top:0.4em;">
        <input type="checkbox" id="consentimento" style="width:auto; margin:0.2em 0 0;" required>
        <span>Autorizo o tratamento dos meus dados de saúde (comorbidades, exames) para fins de acompanhamento do meu tratamento nesta clínica, conforme a LGPD.</span>
      </label>

      <button type="submit" style="width:100%; margin-top:0.8em;">Ativar minha conta</button>
    </form>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get('token')) {
  document.getElementById('token').value = params.get('token');
}

document.getElementById('form-primeiro-acesso').addEventListener('submit', async (e) => {
  e.preventDefault();
  limparAlerta('alerta');
  const nova = document.getElementById('nova_senha').value;
  const repetir = document.getElementById('repetir_senha').value;
  if (nova !== repetir) {
    mostrarAlerta('alerta', 'As senhas não conferem.');
    return;
  }
  if (!document.getElementById('consentimento').checked) {
    mostrarAlerta('alerta', 'É necessário aceitar o tratamento de dados de saúde.');
    return;
  }
  try {
    await api('/api/auth/primeiro-acesso', {
      method: 'POST',
      body: JSON.stringify({
        token: document.getElementById('token').value,
        nova_senha: nova, repetir_senha: repetir,
        consentimento_lgpd_aceito: true,
      }),
    });
    mostrarAlerta('alerta', 'Conta ativada! Redirecionando para o login...', 'success');
    setTimeout(() => window.location.href = '/', 1200);
  } catch (err) {
    mostrarAlerta('alerta', err.message);
  }
});
</script>
</body>
</html>
